<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small House - High & Low</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stress-overlay"></div>
    <div id="flash-overlay"></div>

    <div class="top-status-bar">
        <div class="status-item debt">借金: <span id="debt-display">100,000,000</span> renga</div>
        <div class="status-item money">所持金: <span id="money-display">50,000</span> renga</div>
        <div class="status-item stress">ストレス: <span id="stress-display">0</span>%</div>
        <div class="status-item streak">連勝: <span id="streak-display">0</span></div>
    </div>

    <div class="main-game-screen">
        <header>
            <h1 class="game-title">Small House</h1>
        </header>

        <main>
            <div class="card-area">
                <div class="card-wrapper">
                    <p class="card-label">現在のカード</p>
                    <div class="card" id="current-card">?</div>
                </div>
                <div class="card-wrapper">
                    <p class="card-label">次のカード</p>
                    <div class="card card-back" id="next-card">?</div>
                </div>
            </div>

            <div class="result-area">
                <p id="message-text">謎の家へようこそ。賭け金を入力して、HIGHかLOWを選べ...</p>
            </div>

            <div class="control-area">
                <div class="bet-input-wrapper">
                    <label for="bet-input">BET金額:</label>
                    <input type="number" id="bet-input" value="1000" min="1">
                    <button id="btn-max">MAX</button>
                </div>
                <div class="action-buttons">
                    <button id="btn-high" class="game-btn high-btn">▲ HIGH</button>
                    <button id="btn-low" class="game-btn low-btn">▼ LOW</button>
                </div>
                <button id="btn-next-round" class="game-btn next-btn hidden">次のカードを配る</button>
            </div>
        </main>

        <footer>
            <div class="history-title">ーー 記憶の断片（勝敗履歴） ーー</div>
            <div id="history-log" class="history-log"></div>
        </footer>
    </div>

    <div id="game-over-screen" class="hidden">
        <div class="game-over-content">
            <h2 class="glitch-text">GAME OVER</h2>
            <p>あなたは「Small House」の底へと沈んでいった...</p>
            <button id="btn-restart">もう一度やり直す</button>
        </div>
    </div>

    <div id="sparkle-container"></div>

    <script src="script.js"></script>
</body>
</html>
