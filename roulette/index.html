<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small-house Roulette</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fade-in">
    <!-- Main Background Container -->
    <div id="game-stage">
        <!-- The background image (gazo/rureto.png) is set in CSS -->
        
        <div id="app">
            <div id="back-button" onclick="location.href='../home/index.html'">←</div>

            <!-- Header Status - Invisible/Minimal Overlay -->
            <header id="top-status">
                <div class="status-panel">
                    <div class="status-item">
                        <span id="balance" class="value">50,000</span>
                    </div>
                    <div class="status-item debt">
                        <span id="debt" class="value">100,000,000</span>
                    </div>
                </div>
                <div class="history-panel">
                    <div id="history-list"></div>
                </div>
            </header>

            <main id="game-main">
                <!-- Left: Wheel Area (Interaction Layer) -->
                <section id="wheel-interaction-area">
                    <div id="wheel-container">
                        <div id="wheel-outer">
                            <div id="wheel-inner">
                                <canvas id="wheel-canvas" width="400" height="400"></canvas>
                            </div>
                            <div id="ball-track">
                                <div id="ball"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Right: Betting Table (Invisible Button Layer) -->
                <section id="bet-interaction-area">
                    <div id="betting-board-hitbox">
                        <!-- Hitboxes will be generated by JS as transparent divs -->
                    </div>

                    <!-- Control Hitboxes -->
                    <div id="controls-hitbox">
                        <div id="chip-selection-hitbox">
                            <button class="chip-hitbox" data-value="100"></button>
                            <button class="chip-hitbox" data-value="500"></button>
                            <button class="chip-hitbox" data-value="1000"></button>
                            <button class="chip-hitbox" data-value="5000"></button>
                            <button class="chip-hitbox" data-value="10000"></button>
                        </div>
                        
                        <div id="action-hitbox">
                            <button id="undo-btn" class="hitbox-btn"></button>
                            <button id="clear-btn" class="hitbox-btn"></button>
                            <button id="spin-btn" class="hitbox-btn"></button>
                        </div>
                    </div>
                </section>
            </main>

            <div id="message-display">
                <h2 id="win-message"></h2>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
