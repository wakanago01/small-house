<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small-house Roulette</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fade-in">
    <!-- Background elements -->
    <div id="bg-overlay"></div>
    
    <div id="app">
        <!-- TOP TITLE WITH LACE -->
        <div id="lace-title-wrapper">
            <div class="lace-decoration top"></div>
            <h1 id="main-title">Roulette</h1>
            <div class="lace-decoration bottom"></div>
        </div>

        <div id="back-button" onclick="location.href='../home/index.html'">← 戻る</div>

        <!-- Header Status Bar - Simplified to match original feel -->
        <header id="top-status">
            <div class="status-panel">
                <div class="status-item">
                    <span class="label">COINS</span>
                    <span id="balance" class="value">50,000</span>
                </div>
                <div class="status-item debt">
                    <span class="label">DEBT</span>
                    <span id="debt" class="value">100,000,000</span>
                </div>
            </div>
            <div class="history-panel">
                <span class="label">HISTORY</span>
                <div id="history-list"></div>
            </div>
        </header>

        <main id="game-main">
            <!-- Left: Wheel -->
            <section id="wheel-column">
                <div id="wheel-container">
                    <div id="wheel-outer">
                        <div id="wheel-inner">
                            <canvas id="wheel-canvas" width="400" height="400"></canvas>
                        </div>
                        <div id="ball-track">
                            <div id="ball"></div>
                        </div>
                        <div id="wheel-center"></div>
                    </div>
                </div>
                
                <div id="stats-panel">
                    <h3 class="panel-subtitle">STATISTICS</h3>
                    <div id="stats-container"></div>
                </div>
            </section>

            <!-- Right: Betting Table - NO PANELS, JUST BOARD -->
            <section id="bet-column">
                <div id="betting-board">
                    <div id="table-0" class="cell zero-cell" data-bet="0">0</div>
                    <div id="numbers-grid">
                        <!-- JS Generated -->
                    </div>
                    <div id="columns-area">
                        <div class="cell col-bet" data-bet="col1">2:1</div>
                        <div class="cell col-bet" data-bet="col2">2:1</div>
                        <div class="cell col-bet" data-bet="col3">2:1</div>
                    </div>
                    <div id="outside-bets-area">
                        <div class="cell dozen-bet" data-bet="1st12">1st 12</div>
                        <div class="cell dozen-bet" data-bet="2nd12">2nd 12</div>
                        <div class="cell dozen-bet" data-bet="3rd12">3rd 12</div>
                        <div class="cell binary-bet" data-bet="low">1-18</div>
                        <div class="cell binary-bet" data-bet="even">EVEN</div>
                        <div class="cell color-bet red" data-bet="red">RED</div>
                        <div class="cell color-bet black" data-bet="black">BLACK</div>
                        <div class="cell binary-bet" data-bet="odd">ODD</div>
                        <div class="cell binary-bet" data-bet="high">19-36</div>
                    </div>
                </div>

                <!-- Controls - Simplified -->
                <div id="controls-panel">
                    <div id="chip-selection">
                        <button class="chip c100" data-value="100">100</button>
                        <button class="chip c500" data-value="500">500</button>
                        <button class="chip c1000" data-value="1000">1k</button>
                        <button class="chip c5000" data-value="5000">5k</button>
                        <button class="chip c10000" data-value="10000">10k</button>
                        <input type="number" id="custom-bet-input" placeholder="任意入力">
                    </div>
                    
                    <div id="action-buttons">
                        <button id="undo-btn" class="util-btn">戻す</button>
                        <button id="clear-btn" class="util-btn">クリア</button>
                        <button id="spin-btn">SPIN</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- BLACK CAT DECORATION -->
        <div id="black-cat-container">
            <img src="gazo/cat.png" alt="" onerror="this.style.display='none'">
        </div>

        <div id="message-display">
            <h2 id="win-message"></h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
