<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Roulette</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game">

        <header id="topBar">
            <div id="balance">
                Balance : 50,000 Renga
            </div>

            <div id="day">
                European Roulette
            </div>
        </header>

        <main id="gameArea">

            <section id="rouletteArea">

                <canvas id="rouletteCanvas"></canvas>

            </section>

            <section id="betArea">

                <div class="betTitle">
                    BET
                </div>

                <div id="betTable">
                </div>

                <div id="controls">
                    <button id="spinButton">
                        SPIN
                    </button>
                </div>

            </section>

        </main>

        <footer id="messageBox">
            Rabbit :
            幸運を祈るよ。
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
