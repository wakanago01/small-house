<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Roulette</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game">

        <header id="topBar">
            <div id="balance">
                Balance : 50,000 Renga
            </div>

            <div id="day">
                European Roulette
            </div>
        </header>

        <main id="gameArea">

            <section id="rouletteArea">
<div id="rouletteFrame"><canvas id="rouletteCanvas"></canvas></div>
</section>
<section id="betArea">
                    <button class="chip active" data-chip="100">100</button>
                    <button class="chip" data-chip="500">500</button>
                    <button class="chip" data-chip="1000">1000</button>
                </div>
<div id="resultDisplay">Result : -</div>

                <div class="betTitle">
                    BET
                </div>

                <div id="betTable">
                </div>

                <div id="controls"><button id="spinButton" class="spin-button">SPIN</button><button id="clearButton">CLEAR</button><button id="backButton">BACK</button></div>

            </section>

        </main>

        <footer id="messageBox">
            <div id="rabbitContainer" class="rabbit-dialogue">
                <div id="rabbitChar" class="rabbit-icon">
                    <svg viewBox="0 0 100 120" width="80" height="100">
                        <circle cx="50" cy="80" r="30" fill="#4a3a63" />
                        <circle cx="50" cy="45" r="25" fill="#4a3a63" />
                        <ellipse cx="35" cy="20" rx="8" ry="25" fill="#4a3a63" transform="rotate(-15, 35, 20)" />
                        <ellipse cx="65" cy="20" rx="8" ry="25" fill="#4a3a63" transform="rotate(15, 65, 20)" />
                        <circle cx="40" cy="40" r="3" fill="#ff6b6b" />
                        <circle cx="60" cy="40" r="3" fill="#ff6b6b" />
                        <path d="M 45 55 Q 50 60 55 55" stroke="white" fill="none" stroke-width="2" />
                    </svg>
                </div>
                <div id="speechContent">
                    <div id="rabbitName" class="rabbit-name">Rabbit</div>
                    <div id="rabbitMessage" class="rabbit-message">幸運を祈るよ。</div>
                </div>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
