<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette - Yume Kawaii Dark Fantasy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-container"></div>
    
    <div id="main-layout">
        <div id="back-button" onclick="location.href='../home/index.html'">←</div>
        
        <div id="balance-capsule">
            <span class="icon">🌙</span> <span id="balance">1000</span>
        </div>

        <div id="game-container">
            <!-- Roulette Wheel Area -->
            <div id="wheel-section">
                <canvas id="wheel-canvas" width="400" height="400"></canvas>
                <div id="wheel-pointer">▼</div>
                <div id="last-result" class="hidden">Result: <span id="result-value"></span></div>
            </div>

            <!-- Betting Table Area -->
            <div id="betting-section" class="glass-panel">
                <div id="betting-table">
                    <!-- Numbers will be generated by JS -->
                </div>
                <div id="special-bets">
                    <button class="bet-btn" data-type="red">RED</button>
                    <button class="bet-btn" data-type="black">BLACK</button>
                    <button class="bet-btn" data-type="even">EVEN</button>
                    <button class="bet-btn" data-type="odd">ODD</button>
                </div>
            </div>
        </div>

        <div id="controls-area">
            <div id="bet-setup">
                <button id="bet-minus" class="circle-btn">-</button>
                <span id="bet-amount">10</span>
                <button id="bet-plus" class="circle-btn">+</button>
            </div>
            <button id="spin-btn" class="glow-btn">SPIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
