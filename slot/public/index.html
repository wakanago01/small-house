<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small House Slot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <img src="../image/background.png" id="background">

        <!-- 所持レンガの数字 -->
        <div id="rengaText">1000</div>

        <!-- 後でリールを入れる場所 -->
        <div id="reelArea"></div>

        <!-- 後でミッションを入れる場所 -->
        <div id="missionArea">
            <p>今月のミッション</p>
            <p>BIGを1回当てる　0/1</p>
            <p>ぶどうを10回そろえる　0/10</p>
        </div>

        <!-- 透明ボタン -->
        <button class="hotspot" id="bet1"></button>
        <button class="hotspot" id="bet2"></button>
        <button class="hotspot" id="bet3"></button>
        <button class="hotspot" id="maxBet"></button>
        <button class="hotspot" id="startBtn"></button>
        <button class="hotspot" id="autoBtn"></button>
        <button class="hotspot" id="missionBtn"></button>
        <button class="hotspot" id="settingBtn"></button>

    </div>

    <script src="script.js"></script>

</body>
</html>
