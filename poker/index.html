<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>月夜のポーカー</title>
    <link rel="stylesheet" href="ui/style.css">
</head>
<body>
    <div id="game-container">
        <!-- メインメニュー -->
        <div id="main-menu" class="screen">
            <h1 style="text-align:center; color:var(--moon-gold); font-size:4rem; margin-top:100px; text-shadow:0 0 20px #000;">ポーカー</h1>
            <div class="menu-buttons">
                <button onclick="pokerApp.ui.showScreen('difficulty-select')">ゲーム開始</button>
                <button onclick="pokerApp.showHowTo()">遊び方</button>
                <button onclick="pokerApp.showRanks()">役一覧</button>
                <button onclick="alert('カジノへ戻ります')">戻る</button>
            </div>
        </div>

        <!-- 難易度選択 -->
        <div id="difficulty-select" class="screen hidden">
            <div class="menu-buttons">
                <h2>難易度を選択してください</h2>
                <button onclick="pokerApp.startSetDifficulty('Easy')">Easy</button>
                <button onclick="pokerApp.startSetDifficulty('Normal')">Normal</button>
                <button onclick="pokerApp.ui.showScreen('main-menu')">戻る</button>
            </div>
        </div>

        <!-- ベット -->
        <div id="bet-screen" class="screen hidden">
            <div style="position:absolute; top:180px; width:100%; text-align:center;">
                <div class="status-box">
                    <div style="font-size:1.5rem; color:var(--star-gold); margin-bottom:10px;">所持Renga：<span id="current-renga">0</span></div>
                    <div style="font-size:2.5rem; margin-bottom:30px;">ベット額：<span id="bet-amount">10</span></div>
                    <div>
                        <button onclick="pokerApp.adjustBet(10)">+10</button>
                        <button onclick="pokerApp.adjustBet(100)">+100</button>
                        <button onclick="pokerApp.adjustBet(-10)">-10</button>
                    </div>
                    <button onclick="pokerApp.confirmBet()" style="margin-top:40px; padding:15px 60px; font-size:1.5rem; background:#4b0082; color:white; border:1px solid white; cursor:pointer; border-radius:10px;">決定</button>
                </div>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="play-screen" class="screen hidden">
            <div id="cpu-area"></div>
            
            <div id="game-message" style="position:absolute; top:45%; width:100%; text-align:center; color:var(--lavender); font-size:1.2rem; text-shadow:2px 2px 4px #000;"></div>

            <div id="player-hand" class="hand"></div>

            <div class="exchange-btn-container">
                <button class="invisible-btn" onclick="pokerApp.exchange()">カード交換</button>
            </div>

            <div style="position:absolute; bottom:20px; right:30px; background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:10px;">
                ベット：<span id="info-bet">0</span> Renga
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen hidden">
            <div style="position:absolute; top:35%; width:100%; text-align:center;">
                <h2 id="result-title" style="font-size:5rem; text-shadow:0 0 20px #000;">RESULT</h2>
                <div id="result-details" style="font-size:2rem; margin:20px 0; color:white; text-shadow:2px 2px 4px #000;"></div>
                <div style="display:flex; justify-content:center; gap:20px;">
                    <button onclick="pokerApp.ui.showScreen('difficulty-select')" style="padding:15px 40px; border-radius:30px; cursor:pointer;">もう一度遊ぶ</button>
                    <button onclick="pokerApp.ui.showScreen('main-menu')" style="padding:15px 40px; border-radius:30px; cursor:pointer;">戻る</button>
                </div>
            </div>
        </div>

        <!-- オーバーレイ -->
        <div id="overlay" class="overlay hidden" onclick="pokerApp.ui.hideOverlay()" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:1000;">
            <div class="overlay-content" onclick="event.stopPropagation()" style="background:#2b1646; padding:40px; border:2px solid var(--lavender); border-radius:15px; max-width:70%; color:white;">
                <div id="overlay-text"></div>
                <button onclick="pokerApp.ui.hideOverlay()" style="margin-top:20px; padding:10px 30px; cursor:pointer;">閉じる</button>
            </div>
        </div>
    </div>

    <script src="utils/save_manager.js"></script>
    <script src="utils/player_manager.js"></script>
    <script src="games/poker.js"></script>
    <script src="ui/poker_ui.js"></script>
    <script>
        class PokerApp {
            constructor() {
                this.player = new PlayerManager({ renga: 50000, hunger: 100, items: [] });
                this.ui = new PokerUI(this);
                this.difficulty = 'Easy';
                this.bet = 10;
                this.deck = null;
                this.playerHand = [];
                this.cpuHands = [];
                this.selected = new Set();
            }

            startSetDifficulty(diff) {
                this.difficulty = diff;
                this.ui.updateRenga(this.player.renga);
                this.ui.showScreen('bet-screen');
            }

            adjustBet(amt) {
                if (this.bet + amt >= 10 && this.bet + amt <= this.player.renga) {
                    this.bet += amt;
                    this.ui.updateBet(this.bet);
                }
            }

            confirmBet() {
                this.deck = new Deck();
                this.playerHand = Array.from({length:5}, () => this.deck.draw());
                this.cpuHands = Array.from({length: this.difficulty === 'Easy' ? 1 : 3}, () => 
                    Array.from({length:5}, () => this.deck.draw())
                );
                this.selected.clear();
                this.ui.renderPlayerHand(this.playerHand);
                this.ui.renderCpuHands(this.cpuHands, true);
                this.ui.showScreen('play-screen');
                document.getElementById('game-message').innerText = "交換するカードを選んでください。";
            }

            toggleSelection(idx) {
                if (this.selected.has(idx)) this.selected.delete(idx);
                else this.selected.add(idx);
            }

            exchange() {
                this.selected.forEach(i => this.playerHand[i] = this.deck.draw());
                this.cpuHands.forEach(hand => {
                    const [rank] = PokerHand.evaluate(hand);
                    if (rank === 0) [0,1,2].forEach(i => hand[i] = this.deck.draw());
                    else if (rank === 1) {
                        const val = PokerHand.evaluate(hand)[1][0];
                        hand.forEach((c, idx) => { if (c.value !== val) hand[idx] = this.deck.draw(); });
                    }
                });
                this.determineWinner();
            }

            determineWinner() {
                const [pRank, pVals] = PokerHand.evaluate(this.playerHand);
                let winCount = 0;
                let loseCount = 0;

                this.cpuHands.forEach(h => {
                    const [cRank, cVals] = PokerHand.evaluate(h);
                    if (pRank > cRank) winCount++;
                    else if (pRank < cRank) loseCount++;
                    else {
                        for (let i = 0; i < pVals.length; i++) {
                            if (pVals[i] > cVals[i]) { winCount++; break; }
                            if (pVals[i] < cVals[i]) { loseCount++; break; }
                        }
                    }
                });

                let result = "DRAW";
                if (winCount === this.cpuHands.length) result = "WIN";
                else if (loseCount > 0) result = "LOSE";

                if (result === "WIN") this.player.renga += this.bet;
                else if (result === "LOSE") this.player.renga -= this.bet;

                this.ui.renderPlayerHand(this.playerHand, false);
                this.ui.renderCpuHands(this.cpuHands, false);
                setTimeout(() => this.ui.showResult(result, pRank, this.bet), 800);
            }

            showHowTo() { this.ui.showOverlay("遊び方", "ポーカーで勝負します。不要なカードを交換して、相手より強い役を作りましょう。"); }
            showRanks() { this.ui.showOverlay("役一覧", "ロイヤルストレートフラッシュ、ストレート、フラッシュ、スリーカード、ペアなどがあります。"); }
        }
        const pokerApp = new PokerApp();
    </script>
</body>
</html>
