<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Rabbit Plushie Dealer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-layout">
        <div id="left-controls-container">
            <div id="history-section">
                <h3>LOG</h3>
                <ul id="history-log"></ul>
            </div>

            <div id="betting-section">
                <h3>BET</h3>
                <div id="bet-status-container" class="hidden">
                    <div class="bet-label">BETTING:</div>
                    <div id="current-bet-display">0</div>
                </div>
                <div id="bet-setup-area">
                    <div id="bet-controls">
                        <button id="bet-minus-10" class="bet-btn">-10</button>
                        <button id="bet-plus-10" class="bet-btn">+10</button>
                        <button id="bet-all-in" class="bet-btn">ALL</button>
                        <button id="bet-reset" class="bet-btn">CLR</button>
                    </div>
                    <div id="bet-input-row">
                        <input type="number" id="bet-amount" min="1" value="10">
                        <button id="deal-btn">勝負!</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-container">
            <header>
                <h1>Blackjack</h1>
                <div id="balance-container">
                    所持レンガ: <span id="balance">100</span> 🧱
                </div>
            </header>

            <div id="play-area">
                <div id="dealer-section">
                    <div id="dealer-info">
                        <span class="dealer-icon">🐰</span>
                    </div>
                    <div id="dealer-score-container">
                        <span id="dealer-score" class="score-value">?</span>
                    </div>
                    <div id="table-middle">
                        <div id="dealer-cards" class="card-area"></div>
                        <div id="deck-pile" class="card-back"></div>
                    </div>
                </div>

                <div id="player-section">
                    <div id="player-info"></div>
                    <div id="player-cards" class="card-area"></div>
                    <div id="player-score-container">
                        <span id="player-score" class="score-value">0</span>
                    </div>
                </div>

                <div id="side-controls">
                    <div id="action-section" class="hidden">
                        <div class="action-buttons-column">
                            <button id="hit-btn" class="action-btn">
                                <img src="ヒットボタン.png" alt="ヒット">
                            </button>
                            <button id="stand-btn" class="action-btn">
                                <img src="スタンドボタン.png" alt="スタンド">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="game-controls-area">
                <div id="message-display"></div>
                <button id="reset-btn" class="hidden">もう一度遊ぶ</button>
            </div>
        </div>
    </div>

    <!-- 勝敗時の大きな数値エフェクト用 -->
    <div id="result-overlay" class="hidden"></div>

    <script src="game.js"></script>
</body>
</html>
