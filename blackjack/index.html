<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Yume Kawaii Dark Fantasy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-container"></div>
    
    <div id="main-layout">
        <div id="hamburger-menu">☰</div>
        
        <div id="balance-capsule">
            <span class="icon">🌙</span> <span id="balance">100</span>
        </div>

        <div id="play-area">
            <div id="dealer-section">
                <div id="dealer-score-badge" class="score-badge dealer-score">?</div>
                <div id="dealer-cards" class="card-area"></div>
            </div>

            <div id="deck-area">
                <div id="deck-pile" class="card-back stacked-deck"></div>
            </div>

            <div id="rabbit-doll-area">
                <!-- Glowing area and speech bubble for the rabbit -->
                <div id="rabbit-speech" class="speech-bubble hidden"></div>
            </div>

            <div id="center-message" class="hidden"></div>

            <div id="player-section">
                <div id="player-cards" class="card-area"></div>
                <div id="player-score-badge" class="score-badge">0</div>
            </div>
        </div>

        <div id="bottom-left-controls">
            <div id="bet-setup-area">
                <button id="bet-minus" class="circle-btn">-</button>
                <div id="bet-input-wrapper">
                    <span id="bet-amount-display">10</span>
                </div>
                <button id="bet-plus" class="circle-btn">+</button>
                <button id="deal-btn" class="glow-btn">DEAL</button>
            </div>
            <div id="current-bet-area" class="hidden">
                <span class="bet-label">BET</span>
                <span id="current-bet-display">0</span>
            </div>
        </div>

        <div id="bottom-right-controls" class="hidden">
            <button id="surrender-btn" class="action-btn glow-btn">SURRENDER</button>
            <button id="double-btn" class="action-btn glow-btn">DOUBLE</button>
            <button id="hit-btn" class="action-btn glow-btn">HIT</button>
            <button id="stand-btn" class="action-btn glow-btn">STAND</button>
        </div>
    </div>

    <!-- Overlays -->
    <div id="result-overlay" class="hidden">
        <div id="result-content"></div>
    </div>
    
    <div id="game-over-overlay" class="hidden">
        <div class="game-over-text">GAME OVER</div>
        <button id="reset-btn" class="glow-btn">RETRY</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
